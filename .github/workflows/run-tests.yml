name: SmartStock Complete Test Suite (1400 Test Cases)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Main App Dependencies
      run: npm install

    - name: Install Selenium Test Dependencies
      run: |
        cd selenium-tests
        npm install

    - name: Start Application Server
      run: node server.js &
      env:
        PORT: 3000

    - name: Wait for Server to Start
      run: sleep 5

    - name: Generate Test Cases Excel Sheet (1400 Cases)
      run: |
        cd selenium-tests
        node generate-excel.js

    - name: "🔧 Run Load Tests (350 Test Cases)"
      run: |
        cd selenium-tests
        node tests/load-tests.js

    - name: "🌐 Run Selenium UI Tests (350 Test Cases)"
      run: |
        cd selenium-tests
        node tests/selenium-ui-tests.js

    - name: "🛡️ Run Vulnerability Tests (350 Test Cases)"
      run: |
        cd selenium-tests
        node tests/vulnerability-tests.js

    - name: "🔑 Run Authentication Tests (350 Test Cases)"
      run: |
        cd selenium-tests
        node tests/authentication-tests.js

    - name: Upload Test Cases Excel Sheet (1400 Cases)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: smartstock-test-cases-1400
        path: selenium-tests/smartstock_test_cases.xlsx
