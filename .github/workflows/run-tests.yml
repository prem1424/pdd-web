name: Generate Test Cases and Run E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Main App Dependencies
      run: |
        npm install

    - name: Install Selenium Test Dependencies
      run: |
        cd selenium-tests
        npm install

    - name: Start Application Server
      run: |
        node server.js &
      env:
        PORT: 3000

    - name: Wait for Server to Start
      run: sleep 5

    - name: Generate Test Cases Excel Sheet
      run: |
        cd selenium-tests
        node generate-excel.js

    - name: Run E2E Selenium Tests
      run: |
        cd selenium-tests
        node tests/login-tests.js

    - name: Upload Test Cases Excel Sheet to Workflow Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: smartstock-test-cases
        path: selenium-tests/smartstock_test_cases.xlsx
